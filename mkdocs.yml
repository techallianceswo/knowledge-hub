site_name: TechAlliance Knowledge Hub

theme:
  name: material

  font:
  text: Inter
  code: Roboto Mono

  logo: assets/images/logo.png
  favicon: assets/images/favicon.png

  features:
    - navigation.expand
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

  palette:

    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode

    # Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra:
  status:
    new: Recently Added

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md

  - Idea Stage:
      - Main: idea/index.md
      - Planning: idea/planning.md
      - Data Room: idea/data-room.md
      - Elevator Pitch: idea/elevator-pitch.md
      - Competition Research: idea/competition-research.md
      - Potential Customer Segments: idea/potential-customer-research.md

  - Discovery Stage:
      - Main: discovery/index.md
      - Customer Zoom Tool: discovery/customer-zoom-tool.md
      - IP Strategy: discovery/ip-strategy.md
      - Discovery Interviews: discovery/discovery-interviews.md
      - SME Interviews: discovery/sme-interviews.md
      - Market Research: discovery/market-research.md
      - Product Roadmap: discovery/product-roadmap.md
      - Go-to-Market Plan Draft: discovery/gtm-draft.md

  - Validation Stage:
      - Main: validation/index.md
      - MVP/Pilot Definition: validation/pilot-plan.md
      - Solution Interviews: validation/solution-interviews.md
      - Pilot Project: validation/pilot-project.md

  - Efficiency Stage:
      - Main: efficiency/index.md
      - Sales Assets & Process: efficiency/sales-assets-process.md
      - Ops & HR Plan: efficiency/ops-hr-plan.md
      - Cashflow Forecast: efficiency/cashflow-forecast.md
      - Funding Analysis: efficiency/funding-analysis.md
      - Funding Plan & Assets: efficiency/funding-plan-assets.md

  - Scale Stage:
      - Main: scale/index.md
